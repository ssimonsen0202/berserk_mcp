[build-system]
requires = ["setuptools>=61,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "berserk-mcp"
description = "An MCP server that answers Berserk observability questions through verified, deterministic KQL tools."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Simon Simonsen" }]
keywords = ["mcp", "model-context-protocol", "berserk", "observability", "kql", "telemetry", "otlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dynamic = ["version"]
dependencies = []  # stdlib only — by design

[project.urls]
Homepage = "https://github.com/ssimonsen0202/berserk_mcp"
Issues = "https://github.com/ssimonsen0202/berserk_mcp/issues"

[project.scripts]
berserk-mcp = "berserk_mcp:main"
berserk-claude = "ai_finops:launcher_main"

[tool.setuptools]
py-modules = ["berserk_mcp", "parser_factory", "agent_analytics", "ai_finops", "secret_scan", "ingestion_advisor", "kql_validation", "schema_registry", "_store", "_http", "tool_discovery", "quota_status", "investigation"]

[tool.setuptools.data-files]
"share/berserk-mcp" = ["ingestion_catalog.json", "pricing_catalog.json"]
"share/berserk-mcp/primers" = ["primers/claude.md", "primers/soc.md", "primers/sre.md", "primers/ops.md", "primers/windows-forensics.md"]
"share/berserk-mcp/dashboards/grafana" = ["dashboards/grafana/*.json"]
"share/berserk-mcp/dashboards/berserk" = ["dashboards/berserk/*.kql"]

[tool.setuptools.dynamic]
version = { attr = "berserk_mcp.__version__" }

# ── ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "B",       # flake8-bugbear (common pitfalls)
    "C901",    # McCabe complexity
    "S",       # flake8-bandit (security)
    "PIE",     # flake8-pie (misc. lints)
    "SIM",     # flake8-simplify
    "PERF",    # perflint
    "FURB",    # refurb
    "UP",      # pyupgrade
]
ignore = [
    "E501",    # line length — handled by formatter
    "S101",    # assert used — fine in tests and internal code
    "S603",    # subprocess without shell=True — we use it intentionally
    "S607",    # partial path to executable — acceptable for CLI tools
    "UP035",   # deprecated typing imports — still need py3.9 compat
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]     # security + assert-raises in tests
"evals/*" = ["S"]             # evals are trusted code
"scripts/*" = ["S"]           # scripts are trusted code

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
