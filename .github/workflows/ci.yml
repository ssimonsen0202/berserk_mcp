name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least-privilege default: no job needs write access to anything (no PR
# comments, no releases, no package publishing). Grant more narrowly on a
# per-job basis if a future job needs it, rather than widening this.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run fast focused test (no dependencies)
        run: python tests/test_berserk_mcp.py
      - name: Run full test suite (no dependencies)
        run: python -m unittest discover -s tests
      - name: Run MCP protocol smoke from checkout
        run: python evals/mcp_protocol_smoke.py --include-http
      - name: Build the package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Run MCP protocol smoke from installed console script
        run: |
          python -m pip install --force-reinstall .
          python evals/mcp_protocol_smoke.py --server-command berserk-mcp --include-http

  semgrep:
    # Static, source-only check -- runs once, not per OS/Python-version
    # matrix cell. Custom rules in .semgrep/ codify repo-specific
    # invariants (untrusted-data fencing, issue #11) that generic linters
    # don't know about; see .semgrep/fence-untrusted-data.yml for the
    # rationale and how it was backtested against real historical bugs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: python -m pip install semgrep
      - name: Run custom fencing rules
        run: semgrep --config .semgrep/ --error berserk_mcp.py
