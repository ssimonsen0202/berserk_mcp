name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least-privilege default: no job needs write access to anything (no PR
# comments, no releases, no package publishing). Grant more narrowly on a
# per-job basis if a future job needs it, rather than widening this.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run fast focused test (no dependencies)
        run: python tests/test_berserk_mcp.py
      - name: Run full test suite (no dependencies)
        run: python -m unittest discover -s tests
      - name: Run MCP protocol smoke from checkout
        run: python evals/mcp_protocol_smoke.py --include-http
      - name: Run router eval CI gate unit tests
        run: python evals/test_ci_gate.py
      - name: Router eval CI gate (mock backend, no network/credentials)
        run: python evals/ci_gate.py
      - name: Build the package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Run MCP protocol smoke from installed console script
        run: |
          python -m pip install --force-reinstall .
          python evals/mcp_protocol_smoke.py --server-command berserk-mcp --include-http

  semgrep:
    # Static, source-only check -- runs once, not per OS/Python-version
    # matrix cell. Custom rules in .semgrep/ codify repo-specific
    # invariants (untrusted-data fencing, issue #11) that generic linters
    # don't know about; see .semgrep/fence-untrusted-data.yml for the
    # rationale and how it was backtested against real historical bugs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: python -m pip install semgrep
      - name: Run custom fencing rules
        run: semgrep --config .semgrep/ --error berserk_mcp.py

  mcp-scan:
    # Cisco's MCP scanner against this server's live tools/list. Catches
    # tool-poisoning in tool descriptions -- the attack this server is
    # structurally exposed to, since saved__* tools are projected into
    # tools/list from caller- and LLM-authored text (see
    # _saved_query_description). Validated 2026-09-06 against a
    # deliberately poisoned learned-query store: it flags the injected
    # descriptions HIGH, and that exercise found a real fence-integrity
    # gap in the user-origin path, now fixed.
    #
    # YARA analyzer only: the API/LLM/Behavioral/VirusTotal analyzers need
    # credentials and transmit tool definitions or source to a third
    # party. CI stays local and keyless.
    #
    # The gate applies a reviewed baseline rather than requiring zero
    # findings, because the rules flag deliberate routing/limitation
    # phrasing as prompt injection -- phrasing this project measured as
    # improving real routing accuracy. See scripts/mcp_scan_gate.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install mcp-scanner
        # CI/dev-only dependency. Does not affect the shipped server, which
        # stays standard-library-only by design.
        run: python -m pip install cisco-ai-mcp-scanner
      - name: Scan tools/list for poisoning
        run: python3 scripts/mcp_scan_gate.py
